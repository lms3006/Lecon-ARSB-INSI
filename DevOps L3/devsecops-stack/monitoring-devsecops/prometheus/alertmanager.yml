global:
  resolve_timeout: 5m
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alertmanager@devsecops.local'
  # smtp_auth_username: 'your-email@gmail.com'
  # smtp_auth_password: 'your-app-password'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning'
      repeat_interval: 4h

receivers:
  - name: 'default'
    # Webhook vers un canal de notification (Slack, Teams, etc.)
    # webhook_configs:
    #   - url: 'http://your-webhook-url'

  - name: 'critical'
    # email_configs:
    #   - to: 'admin@devsecops.local'
    #     subject: '🚨 CRITIQUE: {{ .GroupLabels.alertname }}'
    #     body: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'warning'
    # email_configs:
    #   - to: 'admin@devsecops.local'
    #     subject: '⚠️ WARNING: {{ .GroupLabels.alertname }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
