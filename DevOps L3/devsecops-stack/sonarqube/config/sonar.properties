# ============================================================
#  SONARQUBE - CONFIGURATION PRINCIPALE
#  Ce fichier surcharge sonar.properties par défaut
# ============================================================

# --- Web Server ---
sonar.web.host=0.0.0.0
sonar.web.port=9000

# --- Sécurité ---
sonar.forceAuthentication=true

# --- Logs ---
sonar.log.level=INFO
sonar.log.rolling.maxFiles=7
sonar.log.rolling.maxSize=10MB

# --- Analyse ---
# Délai max d'analyse en secondes
sonar.ce.workerCount=2

# --- Couverture de code ---
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Exclusions globales (ajustez selon vos projets) ---
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  **/*.min.js,\
  **/generated-sources/**,\
  **/target/**,\
  **/.git/**

# --- Test d'exclusion ---
sonar.test.exclusions=\
  **/test/**,\
  **/*Test*.java,\
  **/*Spec.js

# --- Règles de sécurité activées ---
# OWASP Top 10, CWE, SANS Top 25 sont inclus dans Community Edition
