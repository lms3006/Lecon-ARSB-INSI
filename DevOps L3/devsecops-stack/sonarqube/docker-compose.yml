
# ============================================================
#  SONARQUBE - DOCKER COMPOSE
#  Analyse de qualité de code & détection de vulnérabilités
#
#  PORTS:
#    - 9000 : Interface Web SonarQube
#
#  PRÉREQUIS SYSTÈME (OBLIGATOIRE sur l'hôte Linux) :
#    sudo sysctl -w vm.max_map_count=262144
#    sudo sysctl -w fs.file-max=65536
#    Pour rendre permanent: ajouter dans /etc/sysctl.conf
#
#  PRÉREQUIS RÉSEAU:
#    cd ../network && docker compose up -d
#
#  DÉMARRAGE:
#    docker compose up -d
#
#  LOGS:
#    docker compose logs -f sonarqube
#
#  ACCÈS:
#    http://localhost:9000
#    Login par défaut: admin / admin (à changer dès le 1er login)
# ============================================================

services:

  # ============================================================
  #  BASE DE DONNÉES POSTGRESQL - SonarQube
  # ============================================================
  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    hostname: sonarqube-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:-sonarqube}
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      # Données PostgreSQL persistantes
      - sonarqube_db_data:/var/lib/postgresql/data
      # Scripts d'initialisation DB
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - devsecops-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

    labels:
      - "com.devsecops.service=sonarqube-db"
      - "com.devsecops.role=database"

  # ============================================================
  #  SONARQUBE - Serveur Principal
  # ============================================================
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    hostname: sonarqube
    restart: unless-stopped

    # SonarQube démarre après la DB healthy
    depends_on:
      sonarqube-db:
        condition: service_healthy

    environment:
      # Connexion à la base de données
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}

      # Elasticsearch tuning (SonarQube l'utilise en interne)
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"

      # Configuration Web
      SONAR_WEB_HOST: 0.0.0.0
      SONAR_WEB_PORT: 9000
      SONAR_WEB_CONTEXT: ""

      # Sécurité
      SONAR_FORCEAUTHENTICATION: "true"

      # Logs
      SONAR_LOG_LEVEL: INFO
      SONAR_PATH_LOGS: /opt/sonarqube/logs

      # Search (Elasticsearch)
      SONAR_SEARCH_JAVAADDITIONALOPTS: >-
        -Dnode.store.allow_mmap=false

      # JVM Options
      SONAR_WEB_JAVAOPTS: "-Xmx1g -Xms128m -XX:+HeapDumpOnOutOfMemoryError"
      SONAR_CE_JAVAOPTS: "-Xmx1g -Xms128m -XX:+HeapDumpOnOutOfMemoryError"
      SONAR_SEARCH_JAVAOPTS: "-Xmx1g -Xms512m -XX:MaxDirectMemorySize=256m"

    ports:
      - "9000:9000"

    volumes:
      # Données SonarQube persistantes
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp

      # Extensions et plugins
      - sonarqube_extensions:/opt/sonarqube/extensions

      # Configuration personnalisée
      - ./config/sonar.properties:/opt/sonarqube/conf/sonar.properties:ro

    networks:
      - devsecops-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

    # Prérequis système Elasticsearch
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"

    labels:
      - "com.devsecops.service=sonarqube"
      - "com.devsecops.role=code-quality"
      - "com.devsecops.version=community"

# ============================================================
#  VOLUMES
# ============================================================
volumes:
  sonarqube_db_data:
    name: sonarqube_db_data
    driver: local
    labels:
      - "com.devsecops.volume=sonarqube-database"

  sonarqube_data:
    name: sonarqube_data
    driver: local
    labels:
      - "com.devsecops.volume=sonarqube-data"

  sonarqube_logs:
    name: sonarqube_logs
    driver: local
    labels:
      - "com.devsecops.volume=sonarqube-logs"

  sonarqube_temp:
    name: sonarqube_temp
    driver: local
    labels:
      - "com.devsecops.volume=sonarqube-temp"

  sonarqube_extensions:
    name: sonarqube_extensions
    driver: local
    labels:
      - "com.devsecops.volume=sonarqube-extensions"

# ============================================================
#  RÉSEAU EXTERNE PARTAGÉ
# ============================================================
networks:
  devsecops-network:
    external: true
    name: devsecops-network
