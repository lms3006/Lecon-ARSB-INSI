
# ============================================================
#  HASHICORP VAULT - DOCKER COMPOSE
#  Gestion centralisée des secrets DevSecOps
#
#  PORTS:
#    - 8200 : API Vault & Interface Web UI
#    - 8201 : Cluster (HA, non exposé)
#
#  PRÉREQUIS RÉSEAU:
#    cd ../network && docker compose up -d
#
#  DÉMARRAGE:
#    docker compose up -d
#
#  INITIALISATION (première fois uniquement):
#    ./scripts/init-vault.sh
#
#  ACCÈS:
#    http://localhost:8200
#    Token Root: généré lors de l'init (garder précieusement !)
#
#  UNSEAL (après chaque redémarrage):
#    docker exec -it vault vault operator unseal <unseal-key>
# ============================================================

services:

  # ============================================================
  #  VAULT AGENT - Renouvellement automatique des tokens
  #  (optionnel, décommentez si nécessaire)
  # ============================================================

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    hostname: vault
    restart: unless-stopped

    environment:
      # Mode de démarrage
      VAULT_ADDR: "http://0.0.0.0:8200"

      # Token root (uniquement pour dev - en prod utiliser init-vault.sh)
      # Commentez cette ligne en production et utilisez operator init
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-}

      # Désactive TLS (activer en production)
      VAULT_SKIP_VERIFY: "true"

      # Logs
      VAULT_LOG_LEVEL: "info"
      VAULT_LOG_FORMAT: "json"

    ports:
      - "8200:8200"     # API & UI
      # - "8201:8201"   # Cluster (HA - non exposé en dev)

    volumes:
      # Configuration Vault
      - ./config/vault.hcl:/vault/config/vault.hcl:ro

      # Données persistantes (secrets chiffrés)
      - vault_data:/vault/data

      # Logs
      - vault_logs:/vault/logs

      # Fichiers d'audit
      - vault_audit:/vault/audit

      # Politiques de sécurité
      - ./policies:/vault/policies:ro

      # Plugins custom (optionnel)
      - vault_plugins:/vault/plugins

    # Commande de démarrage avec la configuration
    command: vault server -config=/vault/config/vault.hcl

    # Capabilities nécessaires pour la protection mémoire
    cap_add:
      - IPC_LOCK

    networks:
      - devsecops-network

    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-c"
        - "wget -q --spider http://localhost:8200/v1/sys/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"

    labels:
      - "com.devsecops.service=vault"
      - "com.devsecops.role=secrets-management"
      - "com.devsecops.version=1.15"

# ============================================================
#  VOLUMES
# ============================================================
volumes:
  vault_data:
    name: vault_data
    driver: local
    labels:
      - "com.devsecops.volume=vault-data"

  vault_logs:
    name: vault_logs
    driver: local
    labels:
      - "com.devsecops.volume=vault-logs"

  vault_audit:
    name: vault_audit
    driver: local
    labels:
      - "com.devsecops.volume=vault-audit"

  vault_plugins:
    name: vault_plugins
    driver: local
    labels:
      - "com.devsecops.volume=vault-plugins"

# ============================================================
#  RÉSEAU EXTERNE PARTAGÉ
# ============================================================
networks:
  devsecops-network:
    external: true
    name: devsecops-network
